<style>
  :root {
    --bg: #f4dff2;

    --ink-soft: #7c4f63;
    --turmeric: #ff6699;

    --chili: #c2504f;
    --herb: #ff99cc;
    --line: rgba(64, 28, 46, 0.14);
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, var(--bg-soft), transparent 55%),
                       radial-gradient(circle at 85% 90%, var(--bg-soft), transparent 55%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .page { width: 100%; max-width: 440px; }

  .brand { text-align: center; margin-bottom: 20px; }
  .brand-emoji { font-size: 34px; display: block; margin-bottom: 4px; }
  .brand h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 18px 0 22px;
  }
  .progress span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .progress span.done { background: var(--turmeric); }
  .progress span.current { background: var(--ink); transform: scale(1.25); }

  .card {
    animation: rise 0.35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
    text-align: center;
    margin: 0 0 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .options.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .option-btn {
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: none;
    border-radius: 14px;
    padding: 16px 14px;
    min-height: 52px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow: 0 3px 0 var(--turmeric-dark);
  }
  .option-btn:hover { background: #fffaf0; }
  .option-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--turmeric-dark); }
  .option-btn:focus-visible {
    outline: 3px solid var(--turmeric);
    outline-offset: 2px;
  }
  .option-btn .emoji { margin-right: 8px; }

  /* Ticket / receipt reveal */
  .ticket-wrap { position: relative; padding: 16px 0 22px; }
  .ticket {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 30px 26px 24px;
    transform: rotate(-0.6deg);
    box-shadow: 0 22px 40px rgba(0,0,0,0.35);
    animation: print 0.45s ease both;
  }
  @keyframes print {
    from { opacity: 0; transform: translateY(-24px) rotate(-0.6deg); }
    to { opacity: 1; transform: translateY(0) rotate(-0.6deg); }
  }
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 14px;
    background:
      radial-gradient(circle at 10px 7px, transparent 7px, var(--bg) 7.5px) repeat-x;
    background-size: 20px 14px;
  }
  .ticket::before { top: -7px; }
  .ticket::after { bottom: -7px; transform: rotate(180deg); }

  .ticket-title {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }
  .ticket-date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-align: center;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .ticket-divider {
    border: none;
    border-top: 1px dashed var(--ink-soft);
    opacity: 0.4;
    margin: 14px 0;
  }
  .ticket-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 24px;
    text-align: center;
    margin: 0 0 10px;
    line-height: 1.25;
  }

  .chip {
    display: inline-block;
    background: var(--herb);
    color: var(--ink);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .ticket-note {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 0 16px;
  }
  .ticket-link {
    display: block;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--chili);
    text-decoration: none;
    padding: 10px;
    border: 1px dashed var(--chili);
    border-radius: 8px;
  }
  .ticket-link:hover { background: rgba(192, 57, 43, 0.06); }
  .ticket-link:focus-visible { outline: 3px solid var(--chili); outline-offset: 2px; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-ghost {
    flex: 1;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn-ghost:hover { background: rgba(64,28,46,0.06); border-color: var(--turmeric); }
  .btn-ghost:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }

  .footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 28px;
  }

  @media (min-width: 600px) {
    .brand h1 { font-size: 32px; }
    .ticket-name { font-size: 27px; }
  }
</style>

const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');

let state = { step: 'start', pool: [], filterTag: null, chosen: null, totalSteps: 3 };

function mapSearchUrl(name) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Hà Nội");
}

function uniqueTags(pool) {
  return [...new Set(pool.map(p => p.tag))];
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function renderProgress(currentIndex, total) {
  progressEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('span');
    if (i < currentIndex) dot.className = 'done';
    else if (i === currentIndex) dot.className = 'current';
    progressEl.appendChild(dot);
  }
}

function renderStart() {
  state.totalSteps = 3;
  renderProgress(0, state.totalSteps);
  stage.innerHTML = `
    <div class="card">
      <p class="question">Bạn muốn ăn hay uống?</p>
      <div class="options grid">
        <button class="option-btn" id="btn-an"><span class="emoji">🍚</span>Ăn</button>
        <button class="option-btn" id="btn-uong"><span class="emoji">☕</span>Uống</button>
      </div>
    </div>`;
  document.getElementById('btn-an').onclick = () => {
    state.totalSteps = 3;
    renderBudget();
  };
  document.getElementById('btn-uong').onclick = () => {
    state.totalSteps = 2;
    state.pool = PLACES.coffee;
    renderStyle(1);
  };
}

function renderBudget() {
  renderProgress(1, state.totalSteps);
  stage.innerHTML = `
    <div class="card">
      <p class="question">Hôm nay đi đâu?</p>
      <div class="options">
        <button class="option-btn" id="btn-re"><span class="emoji">🥢</span>Bình dân</button>
        <button class="option-btn" id="btn-sang"><span class="emoji">🍽️</span>Nhà hàng</button>
      </div>
    </div>`;
  document.getElementById('btn-re').onclick = () => {
    state.pool = PLACES.casual;
    renderStyle(2);
  };
  document.getElementById('btn-sang').onclick = () => {
    state.pool = PLACES.dinner;
    renderStyle(2);
  };
}

function renderStyle(stepIndex) {
  renderProgress(stepIndex, state.totalSteps);
  const tags = uniqueTags(state.pool);
  const buttons = tags.map(t =>
    `<button class="option-btn" data-tag="${t}">${t}</button>`
  ).join('');
  stage.innerHTML = `
    <div class="card">
      <p class="question">Muốn kiểu gì?</p>
      <div class="options">
        ${buttons}
        <button class="option-btn" data-tag="__any__"><span class="emoji">🎯</span>Bất kỳ</button>
      </div>
    </div>`;
  stage.querySelectorAll('.option-btn').forEach(btn => {
    btn.onclick = () => {
      const tag = btn.dataset.tag;
      state.filterTag = tag === '__any__' ? null : tag;
      const filtered = state.filterTag
        ? state.pool.filter(p => p.tag === state.filterTag)
        : state.pool;
      state.filteredPool = filtered.length ? filtered : state.pool;
      state.chosen = pickRandom(state.filteredPool);
      renderResult(stepIndex + 1);
    };
  });
}

function renderResult(stepIndex) {
  renderProgress(stepIndex, state.totalSteps);
  const p = state.chosen;
  const dateStr = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit' });
  stage.innerHTML = `
    <div class="ticket-wrap">
      <div class="ticket">
        <p class="ticket-title">Phiếu gọi món hôm nay</p>
        <p class="ticket-date">${dateStr}</p>
        <hr class="ticket-divider">
        <p class="ticket-name">${p.name}</p>
        <div class="ticket-chip-row"><span class="chip">${p.tag}</span></div>
        ${p.note ? `<p class="ticket-note">${p.note}</p>` : ''}
        <a class="ticket-link" href="${mapSearchUrl(p.name)}" target="_blank" rel="noopener">Xem trên Google Maps →</a>
      </div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="btn-reroll">🎲 Random lại</button>
      <button class="btn-ghost" id="btn-restart">↺ Bắt đầu lại</button>
    </div>`;
  document.getElementById('btn-reroll').onclick = () => {
    state.chosen = pickRandom(state.filteredPool);
    renderResult(stepIndex);
  };
  document.getElementById('btn-restart').onclick = () => {
    state = { step: 'start', pool: [], filterTag: null, chosen: null, totalSteps: 3 };
    renderStart();
  };
}

renderStart();
</script>
</body>
</html>
